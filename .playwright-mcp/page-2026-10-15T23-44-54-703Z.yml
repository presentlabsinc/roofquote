              - generic [ref=f157e1421]: <![CDATA[ 칼라강판 지붕공사를 알아보면 멀티스톤, 기와형, 슬레이트형 등등 다양한데요. 그러다 보니 우리 건물에는 뭐가 맞는지, 뭐가 좋은지 머리가 복잡할 수 있거든요. 그래서 형태와 상황별로 정리해볼게요. 멀티스톤, 전통 기와형, 일반 기와형, 슬레이트형. 크게 4가지 입니다. 모양만 다를 뿐 소재는 같기 때문에 수명이 같아요. 그래서 좋고 나쁘고는 없고 형태와 컬러만 선택하면 돼요. 칼라강판은 뒷면에 폼을 하나 더 붙일 수 있는데 두께는 2~3T예요. 결로를 막고 단열과 소음 차단도 되기 때문에 필요에 따라 옵션으로 쓰입니다. 멀티스톤은 징크 지붕의 방식을 가져온 형태이며 전원주택이나 펜션처럼 모던한 건물에 인기가 많은 타입입니....... <img src="https://blogthumb.pstatic.net/MjAyNjA4MDJfMTEz/MDAxNzg1NjU4MTY4Mjg4.artpcSPRpkLLDgugTmhgbhv345XjrMjuoGTl_2xMIT4g.X7eiVBRCVegtaYS4JJC-_vptd4U08E5taIslIWyVSAog.JPEG/18.jpg?type=s3" /> ]]>
