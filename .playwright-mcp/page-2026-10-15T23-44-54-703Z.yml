              - generic [ref=f157e1855]: <![CDATA[ 칼라강판 방수 특허 공법을 개발한 한농스틸은 기존 우레탄 방수의 단점을 완벽히 보완하는 원천 차단 시스템을 선보입니다. 오늘은 포천과 동두천 현장 사례를 통해 어떻게 반영구적으로 누수를 막고 장기적인 관점에서 옥상 지붕공사 비용을 절감할 수 있는지 생생한 현장 모습과 함께 상세히 설명해 드릴게요. < 포천시 상가 건물 > 이곳은 포천시에 위치한 상가 건물 시공 전 모습입니다. 기존 우레탄 방수층이 심하게 갈라지고 들떠서 바닥 곳곳에 물이 고이고 누수가 발생하던 상태였는데요. 이런 바닥에는 아무리 방수액을 덧칠해도 얼마 못 가 재시공이 필요하게 되거든요. 먼저 튼튼한 목재를 사용해 바닥에 새로운 경사 물매를 만....... <img src="https://blogthumb.pstatic.net/MjAyNjA1MTNfNDIg/MDAxNzc4NjU4NDgwNzky.ow5_Hf79jrYAtZu1amPYqNRPMyaZQDNZP1xAg8IAon0g.kxM8MZ3tMDTXzrb4s6QWY-Zx5NRI6M30vAtA31kdpCUg.JPEG/newpost_%BF%C1%BB%F3%26nbsp%3B%C1%F6%BA%D8%B0%F8%BB%E7%26nbsp%3B%BA%F1%BF%EB%26nbsp%3B%C0%CC%B7%B8%B0%D4_%BE%B2%BC%BC%BF%E4_%280%29.png_386076_1778657845676_1778657945820_0_main.jpg?type=s3" /> ]]>
