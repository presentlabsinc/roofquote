              - generic [ref=f157e1917]: <![CDATA[ 오늘은 기존 바닥을 철거하지 않고 덮어씌우는 방식인 '스틸방수'에 대해 확실하게 짚어드리려고 합니다. 옥상누수 공사 과정과 함께 열반사단열재 추가 옵션까지 설명드릴게요. 기존 바닥 철거 없는 깔끔한 건식 공법 기존 우레탄이 벗겨지고 갈라져 있는 상태를 확인할 수 있죠. 스틸방수는 기존 바닥을 철거하지 않고 그 위에 목재나 철재로 하지 틀을 잡는 건식 공법을 사용합니다. 먼저 바닥에 열반사단열재를 부착하고 촘촘하게 목재로 뼈대를 세운 모습이 보이는데요. 이렇게 하면 지붕 단열까지 한 번에 끝낼 수 있어요. 그리고 이 과정에서 물이 고이지 않고 배수구로 흘러가도록 골조를 세워서 경사(구배)를 만들어주는 것이....... <img src="https://blogthumb.pstatic.net/MjAyNjA1MTFfMjI0/MDAxNzc4NDg2NTMwMjcw.CaBsFvcM-0RZe_75_Yp6uYTuDq--9UFkkh5ZaOasV_gg.U2eJ0qRFz0gdXhrRCvtNBpadbqrFdP9ZDhpJrr-iwHEg.JPEG/newpost_%BF%AD%B9%DD%BB%E7_%B4%DC%BF%AD%C0%E7_%B5%E9%BE%EE%B0%A1%B4%C2_%BF%C1%BB%F3%B4%A9%BC%F6_%B0%F8%BB%E7_%281%29.jpg_259173_1778486112221_1778486190020_0_ma.jpg?type=s3" /> ]]>
