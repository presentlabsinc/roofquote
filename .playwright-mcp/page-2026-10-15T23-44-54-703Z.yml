              - generic [ref=f157e2289]: <![CDATA[ 오늘 보여드릴 현장은 기존 아스팔트슁글 지붕을 새롭게 개량하는 작업입니다. 멀리서 보면 그럴싸해 보여도 가까이서 보면 세월의 흔적이 고스란히 남아있어 근본적인 조치가 필요한 상태였거든요. 흔하게 볼 수 있는 아스팔트슁글 지붕의 모습이에요. 초기 시공비가 저렴해서 많이 쓰이지만 시간이 지나면 표면의 돌입자가 떨어져 나가고 강풍에 찢겨 누수의 원인이 되기 쉽습니다. 주기적인 보수가 필요하다는 게 가장 큰 단점이죠. 튼튼한 뼈대와 칼라강판의 만남 그래서 이번 현장에 적용한 것이 바로 칼라강판 멀티스톤 타입입니다. 완공된 모습인데요. 기존의 칙칙함은 사라지고 아주 모던하고 깔끔한 라인이 돋보이죠. 낡은 아스팔트슁글....... <img src="https://blogthumb.pstatic.net/MjAyNjA0MDlfMjk1/MDAxNzc1NzE4NDM2NjMz.rXMfzu-VbVE3sBFdSP77sv0TLjEalj5_jpVMiCU2XyIg.N6ufS6XFzwYSFz9M1abfucw8dFnM93v3rnZyML9h684g.JPEG/newpost_%BE%C6%BD%BA%C6%C8%C6%AE%BD%B3%B1%DB_%282%29.jpg_947680_1775717030172_1775717064836_1_main.jpg?type=s3" /> ]]>
