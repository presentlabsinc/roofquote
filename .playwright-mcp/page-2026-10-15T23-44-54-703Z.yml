                - generic [ref=f157e180]: <description>
              - generic [ref=f157e181]: <![CDATA[ 우레탄페인트는 한 겹의 고무막이에요 햇빛과 비에 삭으면 갈라지는데 3~5년이 도막방수의 수명입니다. 칠하던 바닥 위에 올라가는 순서 공사 전 바닥은 초록 도막이었어요 군데군데 색이 빠져 바탕이 비쳤는데 재시공 시기를 넘긴 상태였습니다 같은 자리를 칼라강판으로 덮었어요 바닥에는 물결 형태로 깔고 기와 용마루 아래까지 올렸습니다 테두리 벽을 파라펫이라고 불러요 도막은 바닥만 칠하고 끝나는데 벽은 그대로 남는 경우가 많습니다 벽을 타고 내려온 빗물은 바닥과 만나는 자리에 모이거든요 그래서 파라펫 안쪽까지 올라갑니다 우레탄페인트 공사는 고무성이라 굳어도 탄성이 남아 있어요 그 덕분에 바탕이 조금 움직여도 같이 늘....... <img src="https://blogthumb.pstatic.net/MjAyNjEwMDNfNDgg/MDAxNzkxMDE1OTQ2MzM0.fXACsE_V_QcqLpgWk4VYoXfYuR2VsjkzoJpFICKZS4kg.SjeKPtMQcxEvbkXzkibDu3ZXUiR-r9CY-WfbBYQbR-Eg.PNG/0.png?type=s3" /> ]]>
