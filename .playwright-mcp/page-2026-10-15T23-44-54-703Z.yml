              - generic [ref=f157e491]: <![CDATA[ 포스코강판으로 옥상 바닥 전체를 덮고 외벽방수까지 한 번에 진행한 현장이에요 칠하는 방수에서 덮는 방수로 바꿉니다 우레탄 옥상을 철거 없이 덮는 순서 공사 전의 옥상은 우레탄 도막방수였어요 칠은 3~5년이 지나면 수명이 다하는데 그때마다 새로 칠하는 공사가 반복됩니다 먼저 기존 바닥 위로 낙엽송 각재를 걸고 바닥에서 20~40센티 정도를 띄우면서 빗물이 내려가는 물매 경사를 만듭니다 물받이는 스텐 304로 제작했어요 빗물이 늘 지나가는 자리이고 매립을 하기 때문에 강력한 소재를 사용해요 물받이에 모인 빗물은 곧장 내려가는데 우수관을 직경 100미리로 타공해서 폭우가 한꺼번에 쏟아져도 걱정 없죠. 바닥은 물결 형태 포스....... <img src="https://blogthumb.pstatic.net/MjAyNjA5MjFfMjU3/MDAxNzg5OTc0OTY3Mjk1.a29r7aHfuTllntL9sFkQAuxByiGA7lHklFRw3m16MOUg.6XARn2ZtNcdROqIc3oJQbuzwAKfoqtfKMMekWR4eMfEg.PNG/1.png?type=s3" /> ]]>
