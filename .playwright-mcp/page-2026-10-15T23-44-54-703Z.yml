              - generic [ref=f157e2475]: <![CDATA[ 우레탄을 매번 다시 칠해도 얼마 못 가 갈라지고 터지는 악순환에 지치셨다면 오늘 소개해 드릴 옥상 스틸방수 공법을 눈여겨보시길 바랍니다. 저희 한농스틸은 칼라강판 공법을 개발하고 관련 특허를 보유한 전문 회사이며 포스코에서 생산한 아연도금 칼라강판을 사용하여 한 번 시공으로 확실한 누수 차단 효과를 보여드립니다. 곳곳에 크랙이 가고 기존 방수층이 제 역할을 하지 못해 누수가 발생하기 쉬운 환경이었어요. 저희는 이렇게 손상된 바닥을 무리하게 철거하지 않고 그 위로 새로운 지붕 구조를 덮어씌우는 방식으로 작업을 진행합니다. 목재 상 작업과 핵심인 배수 시스템 바닥에 물매(경사)를 만들기 위해 튼튼하게 낙엽송 목재....... <img src="https://blogthumb.pstatic.net/MjAyNjA0MDhfMjYz/MDAxNzc1NjI2MzA2MDA0.Z3unn3JXJtN30dJwKKsXFMJ401Qni-hPlVmFJhogQhwg.hoRDQXT5eNGkXuDNHiCEmAzMkV1BIVyURdWdwHM4qmcg.JPEG/newpost_00.jpg_762334_1775625881324_1775625907970_0_main.jpg?type=s3" /> ]]>
