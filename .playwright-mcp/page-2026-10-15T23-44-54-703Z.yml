              - generic [ref=f157e1793]: <![CDATA[ 누수는 한 번 시작되면 저절로 멈추지 않죠. 물길을 근본부터 잡은 대구 옥상방수 현장을 보여드릴게요. 오래된 주택인데 옥상에서 이미 누수가 시작되고 있던 상태였죠. 장독대가 놓인 평범한 콘크리트 바닥은 겉보기엔 멀쩡해도 미세 균열을 타고 물이 스며들고 있었어요. 바닥에 물매 경사를 잡은 골조 작업입니다. 빗물이 고이지 않고 흐르도록 각도를 만드는 데 가운데를 낮추고 스텐 물받이를 설치했죠. 이게 새지 않는 대구옥상방수 해결 방법의 핵심이에요. 설치된 골조 위로 칼라강판이 올라가는데 이음새마다 빈틈이 없도록 정밀하게 맞물려 연결했어요. 그리고 물받이가 있는 자리는 물만 들어가고 나머지는 위에서 걸러지도록 해줍니....... <img src="https://blogthumb.pstatic.net/MjAyNjA2MjRfMTU1/MDAxNzgyMjkwNTIzMzM1.WzvccFv1iqOvXXoFIb6x9FGB01GSHqJguSB4zsvNlrIg.x2_n5gLHrFYhq0GD1TgBTv8nu04gNlUkgCKS8p6sURwg.JPEG/%B4%EB%B1%B8_%BF%C1%BB%F3%B9%E6%BC%F6_%281%29.jpg?type=s3" /> ]]>
