              - generic [ref=f157e801]: <![CDATA[ 지붕판넬은 이음매와 볼트 부분이 시간이 지나면서 약해지는 자재에요. 그래서 보수보다는 덧방 시공이 필요한데 칼라강판을 쓰면 30년 이상 유지됩니다. 이곳은 충남 보령시에 있는 건물이고요. 세월의 흔적으로 부식이 진행되고 있었고 보수 공사를 해도 누수가 되는 상태였어요 어느 정도 기간이 지났고 잦은 누수 문제가 발생한다면 전제척으로 시공이 필요하죠. 보통은 목재로 상을 걸어주고 시작합니다. 누수 원인을 찾아야 보수도 할수 있는 건데 현장을 가보면 원인을 못 찾아서 해결하지 못하는 사례를 많이 볼 수 있거든요. 골조는 철재를 써도 되지만 목재는 가볍고 단가도 비교적 저렴하기 때문에 많이 써요 철재는 필수로 필요한 곳....... <img src="https://blogthumb.pstatic.net/MjAyNjA4MjhfMjYx/MDAxNzg3OTA3NDYzNTk0.aqrfEc9o1NmuT-MRxDYZFWzZRC00IeTyHD_ZufDdm7kg.Yg6Lxpzh6xJZuZq1rFSzB2ncwXrz00SDfDIU_2mxA38g.PNG/1.png?type=s3" /> ]]>
