                - generic [ref=f157e551] [cursor=pointer]
                - generic [ref=f157e552]: <description>
              - generic [ref=f157e553]: <![CDATA[ 지붕공사 한농스틸은 2010년 특허를 받은 공법으로 옥상을 덮습니다. 칼라강판이 바닥부터 두겁까지 올라가요. 환기구가 많은 옥상은 이렇게 우레탄 방수가 되어 있던 옥상입니다. 도막이 허물처럼 벗겨져 있어서 아래 바닥이 드러난 자리가 많았죠. 목재 위로 칼라강판을 올려 나갑니다. 고정은 물결의 위쪽에 하기 때문에 피스 자리로 물이 들어가지 않아요. 환기구가 서 있는 자리도 둘레를 칼라강판으로 재단해서 감쌉니다. 아래로 물이 들어가지 않게 되고요. 옥상에 환기구가 많으면 손이 많이 가게 돼요. 하나하나 둘레를 재단해서 맞춰야 하니까요. 콘크리트를 뚫고 세운 자리라서 비가 오면 그 틈으로 물이 들어오는 경우도 있습니다. 둘....... <img src="https://blogthumb.pstatic.net/MjAyNjA5MThfMjk5/MDAxNzg5NzE3MDE3NTM3.3SbUJaqaQ_RTNBumg04T0vJg9_AzV_HiqE7Y-EKVk-sg.OmydBez4geKTlUAe9Yttft8HPUIeo3nZcFenbgnnT-sg.PNG/1.png?type=s3" /> ]]>
