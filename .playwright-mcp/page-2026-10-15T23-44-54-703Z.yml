              - generic [ref=f157e925]: <![CDATA[ 우수관 누수는 물받이와 배관을 함께 바꿔야 잡힙니다. 바닥 시트방수는 스테인리스 물받이를 묻어서 넣기 때문에 교체가 없어요. 물이 모이는 자리를 먼저 정합니다 초록색 우레탄이 벗겨지면서 바닥이 드러난 자리가 많았습니다. 칠이 수명을 다한 상태였고요. 기존 바닥은 걷어내지 않아요. 그 위에 낙엽송으로 상을 짜서 한쪽으로 기울어지게 만들죠. 물받이는 가장 낮은 자리에 들어갑니다. 건물 구조와 기존 배관 위치에 따라서 중앙이나 양쪽이 되기도 해요. 물받이는 묻어서 넣습니다 난간벽은 파라펫이라고 부르는데 빗물이 벽을 타고 내려오면서 안쪽으로 스며들기 쉬운 자리입니다. 바닥에서 한두 뼘 정도를 띄우고 목재를 80과 30센....... <img src="https://blogthumb.pstatic.net/MjAyNjA4MjZfMjc4/MDAxNzg3NzI2NzIwNjE2.oxS5dsYQcQvx0Azlo2XfCCPzB_azC6eCr_dfbQHT5bIg.QCMcOoOAz0Wo2g6VkYKyYXscp19zFvNa8xpXtetjxIsg.PNG/1.png?type=s3" /> ]]>
