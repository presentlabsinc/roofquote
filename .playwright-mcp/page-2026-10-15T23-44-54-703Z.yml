              - generic [ref=f157e987]: <![CDATA[ 우레탄방수는 3~5년이면 다시 해야 하는 고무성 페인트예요. 강판으로 덮으면 30년 옥상누수가 없죠. 겉으로는 알기 어려운 누수 겉으로는 문제가 없어 보였지만 아래층 천장에서 물이 새고 있었어요. 바닥만 봐서는 알기 어려운 부분이죠. 물받이는 스테인리스 304를 씁니다. 매립형이라 교체할 일이 없도록 녹슬지 않는 소재를 사용해요. 바닥에는 물결 모양 강판을 올립니다. 고정 피스가 물결 위쪽에 박히니까 그 자리로 물이 스미지 않죠. 걷어내지 않고 위에 올립니다 기존 우레탄방수는 걷어내지 않아요. 그 위에 낙엽송으로 상을 짜 올려서 물이 흐를 경사를 만듭니다. 바닥만이 아니라 난간벽 안쪽과 두겁까지 강판이 올라가요. 옥상누....... <img src="https://blogthumb.pstatic.net/MjAyNjA4MjVfNDkg/MDAxNzg3NjQyNDMwODM5.sGQRTdpr0tSeSxU9Aao2CEzgJKhPaOeYohuEXBNZR78g.jt_E9FyoEV--bjx7HJK_L03YyA-zP030G913v7B5ctQg.PNG/1.png?type=s3" /> ]]>
