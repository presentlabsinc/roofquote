              - generic [ref=f157e677]: <![CDATA[ 칼라강판 스틸 지붕자재를 옥상 바닥에도 그대로 씁니다. 한 번 덮으면 다시 손볼 일이 없어요. 30년을 보는 옥상방수입니다. 걷어내지 않고 그 위에 올려요 바닥 곳곳이 갈라지고 들떠 있었어요. 도막방수는 표면에 바르는 방식이라 오래되면 표면부터 상하기 시작하죠. 물받이를 가운데에 두고 상을 짭니다. 양쪽에서 물이 모이도록 바닥 전체에 경사를 주는 거예요. 물받이는 스테인리스 304로 만듭니다. 매립형이라 교체할 일이 없도록 녹슬지 않는 소재를 써요. 태양광은 그대로 두고 진행 태양광 기둥은 콘크리트를 뚫고 앙카로 고정하는 구조입니다. 요즘은 태양광을 옥상에 많이 올리죠. 기둥을 그대로 두고 사이사이로 상을 짜 나갑니다....... <img src="https://blogthumb.pstatic.net/MjAyNjA4MjdfODcg/MDAxNzg3ODE0NzU2OTY3.mqKQBKH0zxazmjHi5cziFSL_TwfHqtTDi5J69DdT6SMg.wxSj5ke97XwweNdqVZ46cvJmNbMKlhwOtO1ekTU7iwEg.PNG/1.png?type=s3" /> ]]>
