              - generic [ref=f157e1049]: <![CDATA[ 태양광이 올라간 옥상도 패널을 옮기지 않고 스틸방수가 가능합니다. 칼라강판의 수명은 30년이에요. 기존 바닥 위에 강판을 덮습니다 우레탄 방수는 3~5년쯤 지나면 다시 해야 하는 소재입니다. 옥상 상태에 따라 주기가 더 짧아지죠. 기존 바닥은 철거하지 않고 그 위에 낙엽송으로 상을 짜 나갑니다. 주택 기준 공사는 2~3일이면 끝나요. 칼라강판을 덮은 뒤에도 태양광과 실외기는 처음 자리 그대로예요. 옮기지 않았으니 이설 비용도 없고요. 강판에 잡아 둔 경사를 따라 빗물이 낮은 쪽으로 모여 흐릅니다. 물이 고이는 자리가 남지 않아요. 패널 기둥은 이렇게 처리합니다 패널을 받치는 기둥은 콘크리트를 뚫고 앙카로 고정을 하는데, 바....... <img src="https://blogthumb.pstatic.net/MjAyNjA4MjNfMTM1/MDAxNzg3NDcwMjQzOTk3.AG2KLa00cub_P78VfeyHDUu-NDUcLU9r21_atiU4om4g.a2ToJJAJDt7_2QPh8cyg3OgwJH8Q18wiHv487JHmgO0g.PNG/1.png?type=s3" /> ]]>
