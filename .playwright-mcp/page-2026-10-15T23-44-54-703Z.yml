              - generic [ref=f157e1173]: <![CDATA[ 옥상 스틸방수는 좋은 점만 있는 공법이 아닙니다. 비용은 일반 방수보다 높고 사용에도 약간의 제약이 있죠. 대신 수명은 비교가 되지 않고 단점마다 해결 방법도 있어요. ■ 장점, 40년 이상 갑니다 공사 전 상태인데 도막이 벗겨지고 곳곳에 물 자국이 남아 있었어요. 이런 옥상은 다시 발라도 몇 년 지나면 같은 자리가 벗겨집니다. 그래서 아예 방식을 바꾸는 건데, 한 번 시공하면 40년 이상 가죠. 목재로 골조를 짜서 물매를 만들고 그 위에 강판을 덮는 방식인데요. 이 단계에서 스텐 물받이도 함께 앉힙니다. 304 스테인리스를 쓰기 때문에 녹슬 걱정 없이 오래 쓰실 수 있어요. 물매를 타고 내려온 빗물이 여기로 모여 우수관으로 빠지....... <img src="https://blogthumb.pstatic.net/MjAyNjA4MTFfNzgg/MDAxNzg2NDM2NDYwODU3.271VsOgb6W3UlgLVaeACdXU500E0_cA7mdO-WP__zs8g.wSAf97qg95Da57J_wisoztu_L3x8hmbXk4Tujhb1ujUg.PNG/1.png?type=s3" /> ]]>
