              - generic [ref=f157e2599]: <![CDATA[ 비가 오거나 날씨가 궂은 날이면 천장이나 벽면으로 스며드는 빗물 때문에 스트레스받는 분들 많으시죠. 이런 고민을 근본적으로 해결할 수 있는 방법을 나누어보려고 합니다. 특허받은 '바닥 시트형' 공법을 사용하는 한농스틸의 시공 사례를 통해서 말이죠. 포스코 정품 아연도금 칼라강판을 주자재로 사용하여 방수몰탈 없이 옥상 누수를 해결하며 훌륭한 외벽마감재 역할까지 소화하는 현장을 생생하게 보여드릴게요. 특허 등록 업체인 한농스틸은 전국 어디서나 동일한 품질의 직영 시공을 원칙으로 하고 있어요. 사진 상단에 안내된 것처럼 깔끔하고 전문적인 시스템을 갖추고 있답니다. 공사 전 옥상의 모습이며 기존에 되어 있....... <img src="https://blogthumb.pstatic.net/MjAyNjA0MDVfNTQg/MDAxNzc1Mzc1NTQxMTIw.PS0wKX4PaAPgncDKTN_g0FiVV7vKegNeSPjBCo7-79Ug.2i9CFXPzzZPKsVEOk7YSsyxqgJEDjqHxZUuJ74niXdog.JPEG/newpost_%B9%E6%BC%F6%B8%F4%C5%BB_%281%29.jpg_965179_1775374183004_1775374926560_0_main.jpg?type=s3" /> ]]>
