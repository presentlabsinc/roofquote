              - generic [ref=f157e1545]: <![CDATA[ 우레탄 도막방수가 잘못된 공법이라서 이 글을 쓰는 게 아닙니다. 다만 저희는 수명을 다한 현장을 남들보다 많이 봤을 뿐이에요. 그리고 그 위에 다른 답을 얹게 됐죠. 오늘은 시공 사례가 아니라, 저희가 왜 이 방식에 이르렀는지 그 과정을 이야기해 보려고 합니다. 다시 바르는 걸로는 끝나지 않았습니다 처음 마주한 문제는 단순했습니다. 우레탄은 수명이 있다는 것. 색이 다르게 몇 겹씩 쌓인 옥상 바닥을 현장마다 만났어요. 바르고, 갈라지고, 또 바르고. 건물주분들은 대부분 두세 번째 공사를 앞두고 계셨죠. “몇 년 전에 했는데 또 새요” 정말 많이 들은 말입니다. 수명이 다한 도막방수는 이렇게 됩니다. 자외선과 균열에 삭고 벗....... <img src="https://blogthumb.pstatic.net/MjAyNjA3MjBfMTIy/MDAxNzg0NTM2NTE2NjY0.m16ZXebr3IeDlGoGFQoVtUdkskX7YjWjEGs7fo0WUcYg.ElfTh0L1DJLEvED04uHEr0rtPYIfGgQSnRXy6Kk_5qEg.PNG/1.png?type=s3" /> ]]>
