              - generic [ref=f157e615]: <![CDATA[ 칼라강판 시공은 옥상을 덮는 방수예요. 우레탄처럼 반복하는 방식이 아니라 철판을 한 겹 올려서 30년을 씁니다. 태양광 아래로 그대로 들어갑니다 태양광이 올라가 있던 옥상이었어요. 우레탄 방수층이 많이 지워져 있어서 다시 해야 하는 시점이 지났죠. 목재를 걸어서 골조부터 짭니다. 기둥 사이사이로 이어서 나가니까 태양광은 손대지 않게 되고요. 물받이는 스테인리스로 짜서 넣어요. 바닥에는 100미리로 구멍을 내서 우수관과 바로 연결합니다. 목재는 일반 낙엽송을 씁니다. 방부목이 아닌데 썩지 않느냐고 물어보시는 분들이 계세요. 위를 칼라강판으로 덮기 때문에 빗물이 닿지 않고, 아래에는 2mm P.E 을 붙여서 결로까지 막게 됩....... <img src="https://blogthumb.pstatic.net/MjAyNjA5MTRfMjUz/MDAxNzg5MzcxOTUxMTEz.wOfbsixpwh8KSA7bt1YBHtXlTk_Iuq8I-faQHX5iEZsg.jdH-HZ-4ApJ1bcRGfeVIEteHu40xjmgkuPXHBekOfIEg.PNG/1.png?type=s3" /> ]]>
