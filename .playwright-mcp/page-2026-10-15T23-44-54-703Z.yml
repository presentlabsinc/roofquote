              - generic [ref=f157e243]: <![CDATA[ 청주 지붕공사에 철골 골조를 썼어요. 바닥 시트형은 목재가 기본인데 이 현장은 아연각관으로 짰습니다. 골조를 무엇으로 짜는지에 따라 아래층으로 물이 비친 집이었어요 방수칠을 다시 해도 같은 자리가 새니까 덮는 방식으로 잡기로 했습니다 각관을 격자로 짜서 바닥을 덮어요 기존 바닥 위에 그대로 올리고 한두 뼘을 띄워 경사를 잡습니다 옆으로는 작은 지붕이 붙어 있어요 아스팔트 슁글을 올린 자리인데 이 지붕도 함께 공사에 넣었습니다 작은 지붕 쪽은 목재로 짰어요 기존 슁글은 걷어내지 않고 그 위로 각재를 걸었습니다 바닥 시트형의 기본은 목재예요 철재를 원하시는 분들께는 아연각관으로 바꿔 드리는데 이 현장도 그렇게 진....... <img src="https://blogthumb.pstatic.net/MjAyNjEwMDJfMjQ5/MDAxNzkwOTM2MjAwOTg2.xreJgxNxf2qyw_5P0MVxIg6b0Cdreu52WGU9jl2OtLAg.t0grw7quaESUhrEf8zcbq2BmcPnwPcXwMUH_UGt-tYwg.PNG/1.png?type=s3" /> ]]>
