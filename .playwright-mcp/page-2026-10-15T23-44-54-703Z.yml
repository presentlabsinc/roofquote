              - generic [ref=f157e1235]: <![CDATA[ 기와 테두리가 있는 옥상은 방수만으로 끝나지 않습니다. 바닥과 벽면을 잡은 뒤 필요하면 지붕개량까지 해야 되죠. 몰탈 방수액으로 버티던 현장을 어떻게 정리했는지 보여드릴게요. ■ 몰탈 방수액이 오래 못 가는 이유 공사 전 옥상인데 바닥이 평평해서 비가 오면 물이 그대로 머물러요. 한동안은 버텨주죠. 다만 늘 젖어 있는 자리는 그만큼 문제가 생기기 쉽습니다. 같은 자리를 강판으로 마감했어요. 바닥에 2도 정도 물매를 잡아서 물이 한 방향으로 흐르게 했죠. 층을 덧대는 방식이 아니라 물길을 새로 내는 특허입니다. 테두리 기와도 지붕개량으로 바꿨고요. ■ 바닥에 물매부터 잡습니다 여름이면 콘크리트가 햇볕을 그대로 받아 열....... <img src="https://blogthumb.pstatic.net/MjAyNjA4MTBfMjYx/MDAxNzg2MzQ4NjkzMjg2.xmMzbkDa53PH8_acjbbHvVNu8BcY60-NUu_HXhg4wvwg.PDlUifEFWfl2o7pQtvMr3B1YNrTXXeq8kaIH0z_uIBkg.PNG/1.png?type=s3" /> ]]>
