              - generic [ref=f157e2847]: <![CDATA[ 매번 우레탄을 덧발라도 얼마 못 가 갈라지는 경험을 해보셨다면 오늘 소개해 드릴 옥상방수공사 방식이 좋은 대안이 될 수 있습니다. 바로 포스코 칼라강판을 활용한 전문 기업 한농스틸의 특허 공법인데요. 반영구적인 바닥 시트형 공법을 개발하여 확실한 기술력을 바탕으로 많은 분들의 누수 고민을 해결해 주고 있습니다. 시공 전후의 확실한 변화 세월이 흐르면서 바닥이 갈라지고 물이 고인 자국이 선명하게 남아있죠 한농스틸의 특허받은 바닥 시트형 옥상방수 공사를 마친 후의 모습입니다. 포스코 칼라강판을 덮어 빗물이 원천적으로 스며들지 않도록 깔끔하게 시공되었어요. 가까이서 보면 콘크리트 바닥 상태가 더욱 심각해 보입니다....... <img src="https://blogthumb.pstatic.net/MjAyNjA0MDNfMTc3/MDAxNzc1MTk2MTQwNjAz.9owbxpHYJVM4L5Ob4PIEs0lie7-y6FM9C3Fk11k-kl8g.tapdfgC7VsaGVev1MlX4krf38vxVqs6uH17-jOgC9RAg.JPEG/newpost_옥상방수_공사_덮어야_끝이_납니다_(0).png_442868_1775195740450_1775195787563_0_main.jpg?type=s3" /> ]]>
