              - generic [ref=f153e3095]: <![CDATA[ 주택옥상방수 공사 안녕하세요 옥상스틸방수 (주)연합스틸 최초 개발회사 입니다 요즘 날씨가 많이 추운 겨울이고 이제는 첫 눈이 오기를 기다리는 11월 말일입니다 오늘은 2024년 10월에 시공을 했던 서울특별시 강남구 일원동 한 주택 G하우스 건물 전체 테라스+옥상스틸방수 시공후기 입니다. 옥상 같은 경우 우레탄방수이며 테라스는 타일로 되어있던 (시공전) 모습입니다. 우레탄방수의 경우 겨울철 날씨에 시공이 어렵지만 (방수 페인트가 제대로 건조 되지않아 겨울철에는 시공X) 스틸방수는 겨울에도 공사가 가능해서 상담 문의 전화가 끊임없이 오고있는대요 답변해드리자면 스틸방수는 일년내내 겨울에도 공사가 가능하다는점 말씀 드....... <img src="https://blogthumb.pstatic.net/MjAyNDExMjBfMjkw/MDAxNzMyMDg0OTA2NzE3.I99RXZN8AlpbW8pYA7V6Zs2qI2ohqIywGyGKyeIPzgUg.G0PDyoVunWL838zYqg93zporaFakuyc5GQI65Vq5GIMg.JPEG/20241016_141757.jpg?type=s3" /> ]]>
