              - generic [ref=f153e1421]: <![CDATA[ 안녕하세요 모두 즐거운 추석 연휴 보내셨는지요? 오랜만에 인사드립니다!! 저희는 추석 당일을 제외하고, 매일 성수기 공사를 진행하고 있는 최초 옥상스틸방수 개발회사 (주)연합스틸 입니다 오늘은 2025년 5월에 시공을 했던 서울특별시 강서구 화곡 3동에 위치한 대형 종합시장 옥상 방수공사 및 대수선 공사입니다 1. 시공 전 500평이 넘는 넓은 옥상이라 전체를 보여드리기에는 너무 많기에 간단한 사진 몇 장입니다 시공 전은 우레탄 방수였으며, 2~5년마다 당연시하게 반복되는 누수의 번거로움의 종지부를 찍고자 최초 옥상 스틸방수 개발 회사에 공사를 맡겨주셨는데요 2. 시공 중 저희 스틸 패널 시공 3가지 공법 중 가장 기본인 1단....... <img src="https://blogthumb.pstatic.net/MjAyNTEwMTVfMjM2/MDAxNzYwNTIxMzcwNTUw.an0ul02iZxiRgK-UjqT1sc9Qm2QCdeEBYSNFM_7c8lsg.ocRF9_0k8l7Q1N3SrZ_ZUbR-m1zlrV8NqcfiAfhI_s0g.JPEG/20250806_082207.jpg?type=s3" /> ]]>
