              - generic [ref=f153e3033]: <![CDATA[ 안녕하세요 옥상스틸방수 최초 개발회사 (주)연합스틸 입니다 (초창기 외장공사 연합건설 = 현 연합스틸 같은회사) 올해 첫 눈이 정말 어마어마했네요 많이 추워졌고 폭설로 길이 미끄러우니 눈길 조심조심 다니시길 바랍니다. 오늘은 2024년 11월에 시공을 했던 경기도 파주시 어느 한 군부대의 탄약고 옥상스틸방수 시공후기입니다. (시공전) 물로 인한 건물 누수의 대부분은 옥상or지붕으로부터 발생하기 때문에 이를 미리 대비하는것이 최고의 '건물 관리'로 꼽을 수 있습니다 우레탄방수는 제대로 시공을 했을시 최대 5년 그것도 1~2년에 한번씩 꾸준히 상도 칠을해야 유지가 되고 세월이 지나면 균열과 누수가 찾아오는대요....... <img src="https://blogthumb.pstatic.net/MjAyNDExMzBfMjky/MDAxNzMyOTY2NDg0MjQ5.3w8PKLBq-VP8klVp9GjFdZjh1blR_yT5AxO8d5de7Qkg.dsAns67jK6g9zw00iyQtDWriLrOuOYQ5nNTI1NucBKcg.JPEG/20241031_162836.jpg?type=s3" /> ]]>
