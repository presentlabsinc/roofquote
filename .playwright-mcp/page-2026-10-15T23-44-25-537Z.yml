              - generic [ref=f153e1669]: <![CDATA[ 안녕하세요 옥상 스틸방수는 (주)연합스틸 최초 개발 회사입니다 이번 주는 전국적으로 폭우가 아직까지도 내리고 있고 엄청나게 뜨거웠던 폭염이 잠시 사라졌지만 한편으로는 홍수로 인해 피해 보시는 분들을 뉴스로 접하니 마음이 무겁네요... 정말 어마어마하게 쏟아지더라고요! (하루빨리 피해 복구가 되기를 바랍니다) 쏟아지는 비만큼 건물 내 누수 역시도 발생하는데요 오늘은 2025년 4월에 시공했던 서울특별시 광진구 아차산로에 위치한 Y 빌딩 메지 몰딩형 금속 패널 옥상 방수공사입니다 1. 시공 전 이번 현장 역시 시공 전은 우레탄 방수(도막방수, 페인트 방수)였습니다 항상 소개해 드렸듯이 옥상 스틸 방수는 기존 방수층을 철거....... <img src="https://blogthumb.pstatic.net/MjAyNTA3MThfNTAg/MDAxNzUyODMyNTE2ODI3.5BlOQRmxKaKGwV-0tzLLVzr77nO7zVV3Qg6kfBcONGsg.70msMYEJ3PWiJjZb10SI33OiMUpl7ZDXL1bIQjlweWQg.JPEG/20250428_092749.jpg?type=s3" /> ]]>
