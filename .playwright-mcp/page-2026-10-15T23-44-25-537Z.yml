              - generic [ref=f153e2909]: <![CDATA[ 안녕하세요 스틸방수는 연합스틸 최초 옥상스틸방수 개발회사 입니다 44년 만의 계엄령 후 현재 모든 뉴스채널에서 보도되고 있는 있는 시기! 탄핵 얘기까지 거론되며, 하루빨리 모든 사태가 종료되고 다시 평온한 일상으로 돌아가기를 다들 희망하실 텐데요 오늘은 2024년 11월에 시공을 했던 충청북도 제천시 명륜로에 위치한 목화게스트 하우스입니다 (제천 시청에서 관리하는 관공서 건물) 1. 시공 전 옥상 시공 전 기존 방수층 위가 인조잔디라서 보기에는 아주 괜찮아 보이지만 건물 내부로 물이 샌다면 보기 좋은 떡일 뿐이죠 철거비용 또한 없다는 점에서도 스틸방수의 큰 장점입니다 기본 10년 이상은 걱정 없이 건물 관리를 고민하실 때....... <img src="https://blogthumb.pstatic.net/MjAyNDEyMTJfMjU5/MDAxNzMzOTk0Nzk3MTE4.yMP0ZhkLq7baHQrfT63JfWfCDeKjppYibJFJJ_6sSlQg.Tax1YkG3S207ZFuhvwjtnX-dQaCAxHvBOzf19UM2wFAg.JPEG/20241119_114621.jpg?type=s3" /> ]]>
