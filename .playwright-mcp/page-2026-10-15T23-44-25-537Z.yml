              - generic [ref=f153e2413]: <![CDATA[ 안녕하세요 최초 옥상스틸방수 개발회사 (주)연합스틸 입니다 또다시 눈이 쏟아지며 바람도 많이 불고 날씨 또한 영하 10도 이하로 이제는 마지막 한파가 온 것만 같네요 출퇴근길 빙판길 조심히 다니시고 항상 안전운전하시길 바랍니다 (오늘만 차량 사고 3번이나 목격했네요!) 오늘은 2025년 1월에 시공했던 충청남도 천안시 서북구에 위치한 공장 옥상 방수공사입니다 1. 시공 전 아무래도 기존의 방수층을 모두 철거하고 진행하게 되면 (대표적으로 우레탄 방수, 시트 방수 등등) 철거에 대한 비용과 시간이 들기 때문에 방수공사 견적을 막상 받아보시면 부담이 되는 건 사실입니다 옥상 스틸 단열패널 방수의 장점은 기존 방수층 철거하지....... <img src="https://blogthumb.pstatic.net/MjAyNTAyMDdfNTUg/MDAxNzM4OTM0NzkyOTMy.7_1JIq4mBC959WV7wGjBpARQ3kmHoVjhf26tDkpydi0g.iu2zss8bh-T0K07MNkDaZq62DvsphaXebacYPWgD3uog.JPEG/20241231_112341.jpg?type=s3" /> ]]>
