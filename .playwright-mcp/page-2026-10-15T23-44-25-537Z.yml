              - generic [ref=f153e2785]: <![CDATA[ 안녕하세요 옥상방수업체 명품 스틸 방수공사 전문 업체 최초 옥상스틸방수 개발회사 (주)연합스틸 입니다 Merry Christmas !! 오늘은 2024년 11월에 시공을 했던 충청남도 논산시 벌곡면 양산리에 위치한 무궁화 추모공원 옥상 스틸 방수공사입니다 1. 시공 전 2. 자재 양중 3. 벽면 시공 시작 이전 포스팅에서 벽면 부분도 스틸 방수 패널을 하면 좀 더 깔끔해 보인다고 말씀을 드린 적이 있는데요 이번 시공현장이 바로 벽판도 시공! 우선 벽면 부분부터 공사 시작을 합니다 4. 옥상 바닥면 스틸 단열패널 패널 속에 18mm 압축 비드 난연 단열재가 있어 겨울철엔 따뜻하게 여름철엔 시원하게!~ 5. 시공 완료 ( 1단계 메지 실링형 현장) 대한민....... <img src="https://blogthumb.pstatic.net/MjAyNDEyMjVfMTY2/MDAxNzM1MDk1NDcxMjcx.ZtkhFP8VcxZASVBaT7VQHd1fFApXlEbzkAaK3BVp-JMg.ONpBHYnp2yIx7zQvJ4hWX9Lwf5Kp2oGLMTqUMQ3Mw-Qg.JPEG/20241123_142607.jpg?type=s3" /> ]]>
