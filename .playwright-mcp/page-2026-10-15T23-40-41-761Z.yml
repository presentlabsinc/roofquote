          - paragraph [ref=f103e112]: Remove and dispose of existing roofing to bare wood sheathing. Install ice-barrier membrane at roof perimeter, and premium-grade synthetic underlayment over roof. Install 3,000 square feet of prefinished, standing-seam metal roofing with matching preformed accessories, including drip edge, gable trim, and vented ridge flashing. Assume a rectangular hip roof; custom flashing at two average-size skylights; custom cap treatment at vented ridge.
