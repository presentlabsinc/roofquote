              - generic [ref=f52e3033]: <![CDATA[ 외벽이나 옥상 방수는 한 번 공사할 때 제대로 된 방법을 선택해야 중복 투자를 막을 수 있거든요. 건축 외장재 정품 칼라강판을 활용해 옥상과 지붕, 외벽 방수 및 리모델링을 전문으로 하는 한농스틸의 시공 사례를 통해 확실한 해결책을 알려드릴게요. 단열과 방수를 동시에 잡는 외벽 시공 과정 공사 전 건물의 외관입니다. 시간이 흐르면서 외벽이 낡고 변색된 것을 확인할 수 있어요. 이런 상태라면 미관상 좋지 않을 뿐만 아니라, 빗물이 벽면의 미세한 크랙을 타고 내부로 스며들어 외벽 누수가 발생하기 쉽거든요. 벽면을 은색 자재로 꼼꼼하게 덮어주었는데 열반사 단열재입니다. 단순히 겉모습만 바꾸는 게 아니라 이렇게 단열재를 밀....... <img src="https://blogthumb.pstatic.net/MjAyNjAzMTBfMTE3/MDAxNzczMTI1NDY3NTM1.ogxRagIvY9WIIuRPl8RNza_qSNpXPyUtuGITA8qJsygg.iouaQjmByq05GmfP-WnXOVxRHjg0_Bgr6XsEXYkTAAwg.JPEG/newpost_1.0건축_외장재_루바패널_적용_전후.png_378884_1773114175795_1773124496145_0_main.jpg?type=s3" /> ]]>
