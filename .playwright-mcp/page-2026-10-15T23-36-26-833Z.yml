              - generic [ref=f52e1359]: <![CDATA[ 옥상 스틸 방수만 해도 실내 온도가 약 2도 내려갑니다. 여기에 열반사 단열재를 더하면 3~4도, 발포 우레탄폼을 넣으면 5도 이상 떨어지죠. 옥상단열 자재를 모두 시공해 본 경험을 바탕으로 성능과 비용, 시공 방식의 차이를 정리해 봅니다. 방수만 해도 2도가 내려갑니다 공사 전 옥상이에요. 도막이 벗겨지고 얼룩이 번졌죠. 이런 노출 콘크리트는 여름 햇볕을 그대로 받습니다. 밤에 달궈진 열이 밤까지 실내로 내려와요. 같은 옥상을 강판으로 시공한 모습입니다. 단열재 없이 방수만 했는데도 실내 온도가 약 2도 내려가죠. 강판과 바닥 사이 공기층이 열을 한 번 걸러주기 때문이에요. 다만 요즘 여름은 2도만으로 버티기 어렵습니다. 그....... <img src="https://blogthumb.pstatic.net/MjAyNjA4MDZfMjE4/MDAxNzg2MDA1NDc5MTU2.INYG3zFysx8pCQUihy1vy55myeLL9n4IwWGZKNNxT5kg.V9-V-CI1hWa1WHvd80K0oxdpHMgAXfPDJWsvp3HlKSYg.JPEG/1.jpg?type=s3" /> ]]>
