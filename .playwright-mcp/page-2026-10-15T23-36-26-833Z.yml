              - generic [ref=f52e1483]: <![CDATA[ 옥상방수는 이름부터 헷갈립니다. 우레탄, 도막, 시트, 몰탈, 스틸까지. 종류는 많은데 뭐가 맞는지 알기 어렵죠. 오늘은 대표적인 두 가지를 중심으로 차이를 정리해 보겠습니다. 나머지 공법도 짚어드릴게요. 공사한 지 몇 년 지난 곳입니다. 부분 보수를 반복한 자국이 남아 있죠. 누수는 보통 이런식으로 시작돼요. 바닥에 물이 고이면 그 자리부터 삭습니다. 다음 비에도 같은 자리부터 빗물이 고이죠. 그래서 물매 경사 각도가 필수적이에요. 누수를 바닥에서만 찾으면 파라펫 균열을 놓치게 되죠. 누수의 진짜 입구가 벽인 경우도 많습니다. 이런 현장도 자주 봅니다. 누수가 안 잡히니 판넬을 깔아둔 거예요. 급한 대로 막아보는 방법인....... <img src="https://blogthumb.pstatic.net/MjAyNjA3MzBfMTE0/MDAxNzg1NDA1OTQ4Mjg4.66N7aFlJ-O4u59mdGZLmbbH1IK6RN6rujDuiM5W1IfQg.pXFV4Oj-gfCcL_a2vFtJO4530iGR3KARDueeJZZGIuYg.JPEG/jjf.jpg?type=s3" /> ]]>
