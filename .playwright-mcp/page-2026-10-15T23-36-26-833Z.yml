              - generic [ref=f52e739]: <![CDATA[ 방수몰탈의 균열은 메워도 또 생깁니다 그 위 우레탄도 주기가 3~5년이고요 칼라강판을 덮으면 주기에서 벗어납니다 방수몰탈 시멘트 위에 우레탄을 올리고 그 위에 또 덧칠을 했던 옥상이에요. 덧칠 자국이 군데군데 그대로 남아 있죠. 목재로 높낮이를 줘서 물이 흘러갈 경사를 만들어 나갑니다. 가운데로 모여든 물은 물받이를 타고 빠져나가요. 목재는 바닥에서 그대로 멈추지 않고 파라펫 벽의 위쪽까지 올라갑니다. 두겁까지 하나로 이어서 덮으려는 거죠. 물받이는 스테인리스로 짜서 넣어요. 빗물이 늘 닿아 있는 자리라서 부식이 가장 먼저 시작되는 곳이거든요. 우수관은 100미리로 다시 타공합니다. 폭우가 내려도 넘치지 않게 개수도....... <img src="https://blogthumb.pstatic.net/MjAyNjA4MzBfMjI2/MDAxNzg4MDcxOTkzNTM0.HQQPbmPG4QCONxo0IgG8jFMDnQctsrxozf1zAq5ebb0g.ZA6RzriGZCL2QiGosdn17f7_n5XLwe0NbClEgYrS2qUg.PNG/1.png?type=s3" /> ]]>
