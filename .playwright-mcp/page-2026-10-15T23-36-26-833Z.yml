              - generic [ref=f52e3095]: <![CDATA[ 비가 올 때마다 천장을 올려다보며 한숨 쉬어본 적 있으신가요? 옥상이나 지붕에서 한 번 누수가 시작되면 아무리 임시방편으로 막아도 금세 다시 물이 새기 마련이죠. 매번 보수 공사를 부르자니 스트레스가 이만저만이 아닐 텐데요. 오늘 여러분의 이런 고민을 시원하게 덜어줄 확실한 해답을 소개해 보려 합니다. 대전누수 탐지가 필요 없게 원인을 없애는 공법을 설명드릴게요. 옥상의 현실, 그리고 새로운 뼈대 세우기 공사 전 옥상의 모습입니다. 곳곳에 시멘트 바닥이 그대로 드러나 있고, 과거에 칠해두었던 녹색 우레탄 방수층은 이미 수명을 다해 벗겨져 있죠. 흔히 접하는 우레탄 방수는 자외선과 온도 변화에 약해 보통 3~5년마다 재....... <img src="https://blogthumb.pstatic.net/MjAyNjAzMDlfNzEg/MDAxNzczMDQ2Mzk5MTg1.HPYoQyIOY8bW7D3zoyD3qb2GpIR3Xo8e6B4X5Kw-eScg.6EubALbqqBV1jZHY8Xm-tvcnZyShlFKeei6N4FKxnVQg.JPEG/newpost_1._대전누수_탐지_말고_원인을_없애는_공법.png_361135_1773023527764_1773045662775_0_ma.jpg?type=s3" /> ]]>
