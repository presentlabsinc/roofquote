              - generic [ref=f52e1979]: <![CDATA[ 비만 내리면 고민이 많으신가요? 한농스틸 특허는 기존 방수층을 철거할 필요 없이 부식에 강한 포스코 칼라강판을 덮어씌우는 방식인데요. 오늘은 청주누수 방수업체 사례를 보면서 실제 어떤 과정을 거쳐 완성되는지 살펴보겠습니다. 공사 전 옥상 모습입니다. 기존 녹색 우레탄 층이 벗겨지고 물때가 낀 흔적이 곳곳에 보이죠. 에어컨 실외기도 다수 배치되어 있었어요 우레탄을 제거하지 않고 그 위에 목재를 이용해 물매(물이 빠지는 경사)를 꼼꼼하게 잡은 뒤 스텐 빗물받이까지 설치된 모습이에요. 공사 후 모습입니다. 반영구적인 칼라강판으로 덮었으며 기존 바닥과 스틸 패널 사이에 생긴 공기층이 열을 차단해 주어 냉난방 에너지 효....... <img src="https://blogthumb.pstatic.net/MjAyNjA1MTFfMTAy/MDAxNzc4NDgzMjAzMTk4.jt7YDRvm-q6wX1fV56PTeSDlmUzjy4jcpCGpzZz7dS4g.PDp4nE5M98e39fr48Q3zPhdixHAYQqYI4gNFpImCYfwg.JPEG/newpost_%C3%BB%C1%D6%B4%A9%BC%F6_%BA%F3%C6%B4%BE%F8%C0%CC_%BD%C3%B0%F8%C7%CF%B4%C2_%B9%E6%BC%F6%BE%F7%C3%BC_%280%29.png_454312_1778480603811_1778480657804_0_mai.jpg?type=s3" /> ]]>
