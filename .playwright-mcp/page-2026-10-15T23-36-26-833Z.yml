              - generic [ref=f52e1607]: <![CDATA[ 옥상방수 공사를 했는데 몇 년 지나 천장누수가 다시 발생한다. 저희가 상담에서 가장 자주 듣는 이야기입니다. 업체가 잘못해서일까요? 꼭 그렇지만은 않습니다. 원인을 찾아 막는 방식 자체에 구조적인 한계가 있기 때문이에요. 오늘은 왜 공사가 반복되는지 그리고 원인을 못 찾아도 해결되는 방법은 무엇인지 정리해 보겠습니다. 보통 이런 순서를 밟습니다. 업체를 부르면, 올라가서 갈라진 곳을 찾고, 거기를 막습니다. 그런데 다음 장마에 얼룩이 또 번져요. 다른 업체를 부르면 다른 곳을 지목합니다. 또 막고, 또 새고. 집주인 입장에선 답답할 수밖에 없습니다. 도대체 왜 원인을 못 찾는 걸까요? 물은 들어온 곳과 새는 곳이 다를 수....... <img src="https://blogthumb.pstatic.net/MjAyNjA3MTlfMjcz/MDAxNzg0NDQ2MTg4MDQw.NIKz8q-6ErEijVB-Zpkv5mSs89tAgGeEHaWuQaZ1tjIg.aJ3dGtlBkluKeyzBQe9CA8qqO3hpWT659RltOYgkI74g.JPEG/0.jpg?type=s3" /> ]]>
