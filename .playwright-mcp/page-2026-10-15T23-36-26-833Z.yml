                - generic [ref=f52e2102]: <description>
              - generic [ref=f52e2103]: <![CDATA[ 건물 노후화로 빗물이 새기 시작하면 정말 골치가 아프죠. 임시방편으로 보수해 보아도 비가 많이 오는 장마철만 되면 다시 누수가 발생하기 일쑤입니다. 오늘은 전국 단위 직영 시공 네트워크를 운영하며 칼라강판 공사를 전문으로 하는 한농스틸의 현장을 소개 드릴게요. 세련된 외관과 외벽 발수제 공사가 필요 없게 만드는 템바 징크시공 과정을 꼼꼼히 살펴보겠습니다. 공사 전 건물인데요. 곳곳에 녹이 슬고 낡아서 비가 오면 누수 위험이 상당히 높아 보이거든요. 이런 상태를 방치하면 건물 내부의 단열재까지 물을 먹어 곰팡이가 피고 2차 손상으로 이어지게 됩니다. 본격적인 공사 중인 모습이에요. 기존 벽면을 번거롭게 철거하지 않....... <img src="https://blogthumb.pstatic.net/MjAyNjA1MDlfMTAz/MDAxNzc4MzE1MzQ5OTgz.zhNSWh7kTLaP_kMK_SXi3xE6sgHaVNkf_d7edLcOHmEg.6uJmrL1mDiSeGBVAVnEuydm_dYfeWxahP_4BStTY80wg.JPEG/newpost_%BF%DC%BA%AE_%B9%DF%BC%F6%C1%A6_%BA%B8%B4%D9_%C8%AE%BD%C7%C7%D1_%C2%A1%C5%A9%BD%C3%B0%F8_%281%29.jpg_239202_1778314871589_1778314916669_0_main.jpg?type=s3" /> ]]>
