              - generic [ref=f52e2227]: <![CDATA[ 오늘은 한농스틸의 바닥 시트형 특허 공법을 소개해 드리려고 해요. 2004년에 개발되어 2010년 특허 등록까지 완료된 이 기술은 한 번의 옥상방수공사로 반영구적인 수명을 유지하는 것을 목적으로 하며 포스코(POSCO) 정품 칼라강판을 주자재로 사용하고 있습니다. 본격적인 작업에 앞서 크레인으로 무거운 자재를 안전하게 올리는 모습이에요. 시공팀을 운영하고 있어, 어떤 현장 상황에서도 안전하고 신속하게 자재를 운반할 수 있는 시스템을 갖추고 있습니다. 갈라지고 터진 바닥, 원천 차단 시스템이 필요한 이유 기존 우레탄이 수명을 다해 곳곳이 갈라지고 오염된 상태예요. 이런 바닥에 단순히 방수액을 덧바르는 방식은 얼마 못 가 다....... <img src="https://blogthumb.pstatic.net/MjAyNjA1MDVfMzcg/MDAxNzc3OTY0MTYzNTA4.ubgQEeRpz5KAhyANKevuT5-XcgL2Wewi5ro9FY1ctdYg.nwyHZMweU_nRjyJ5rcrFw3-bJoYchzXCh0geSKMgFmIg.JPEG/newpost_%BF%C1%BB%F3%B9%E6%BC%F6_%B0%F8%BB%E7_%B1%B8%C1%B6%BA%B0_%BC%D6%B7%E7%BC%C7_%280%29.png_337105_1777963434637_1777963592922_0_main.jpg?type=s3" /> ]]>
