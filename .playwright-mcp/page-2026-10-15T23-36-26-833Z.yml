              - generic [ref=f52e1297]: <![CDATA[ 슬라브 지붕공사로 새는 옥상, 잡는 방법 네 가지를 정리합니다. 만 건 넘는 현장을 시공하며 확인한 내용이에요. 누수 원인은 대부분 고인 물이죠. 덧바르는 방수로는 못 없앱니다. ■ 새는 원인은 고인 물이었습니다 공사 전 옥상이에요. 바닥이 평평하다 보니 비가 오면 물이 빠지지 않고 머뭅니다. 우레탄방수를 새로 해도 고인 자리는 도막이 빨리 삭죠. 물이 고이는 조건 그대로면 얼마 못 가 다시 샙니다. ■ 첫째, 바닥에 물매를 잡습니다 목재로 골조를 짜는 단계예요. 물매를 만들고, 물받이를 잡고, 칼라강판까지 받치는 뼈대입니다. 기울기는 보통 2도 정도 잡죠. 더 올리면 물은 잘 빠지지만 밟고 다니기 불편해집니다. ■ 둘째, 스....... <img src="https://blogthumb.pstatic.net/MjAyNjA4MDlfMTM0/MDAxNzg2MjU4Mjc3NDc1.fdEVHV1lnIED5RtxyqdW3OZ0kWA53Zcbay5KZCRHZx4g.iaS5QWFtG8w_BRPgWSJKpt_tndUHVfw2hilSDZpaocsg.PNG/1.png?type=s3" /> ]]>
