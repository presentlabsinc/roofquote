              - generic [ref=f52e2165]: <![CDATA[ 비만 오면 천장이 젖고 곰팡이가 피어 스트레스받는 분들 많으시죠. 매번 우레탄을 덧발라도 몇 년 못 가 다시 새는 방수 문제, 이제는 근본적인 해결책이 필요합니다. 오늘은 한 번 시공으로 30년에서 최대 50년까지 방수 성능이 유지되는 '스틸방수'에 대해 명쾌하게 짚어드릴게요. 스틸방수는 아연 도금 처리가 된 포스코(POSCO) 칼라강판을 덮어 물을 원천 차단하는 공법인데요. 현장 사진과 함께 칼라강판 지붕공사의 실제 과정을 자세히 보여드리겠습니다. 기존 바닥 철거 없이 진행되는 깔끔한 시공 공사 전 모습입니다. 비닐하우스가 올려져 있고 기존 우레탄 방수층이 군데군데 벗겨져서 누수가 발생하기 딱 좋은 상태였어요....... <img src="https://blogthumb.pstatic.net/MjAyNjA1MDhfOTUg/MDAxNzc4MjI2MDcxODU2.G08U_Wm6ragJetdNiaMkZeWhVcqThH79iRTWsjkluOIg.cvLwop2qXo9BsP3QtdkPyIm3Z1MmvuF2vLQOzHiejlUg.JPEG/newpost_%C4%AE%B6%F3%B0%AD%C6%C7_%C1%F6%BA%D8%B0%F8%BB%E7_%BF%C1%BB%F3_%BA%F8%B9%B0_%B0%C6%C1%A4_%B3%A1_%280%29.png_357068_1778225648407_1778225721690_0_ma.jpg?type=s3" /> ]]>
