              - generic [ref=f52e863]: <![CDATA[ 옥상 지붕공사는 인허가부터 확인해요. 1.2미터를 넘어가면 대상이 되거든요. 바닥으로 낮게 가면 해당되지 않습니다. 태양광이 올라간 옥상, 어디서 새는가 태양광이 올라가 있던 옥상이었어요. 기둥은 콘크리트를 뚫고 앙카로 단단하게 고정한 구조였습니다. 목재로 높낮이를 줘서 경사를 잡아요. 가운데로 모인 물은 스텐 물받이를 타고 우수관까지 그대로 내려갑니다. 기둥 사이사이로 강판이 다 들어갔어요. 고정은 물결의 위쪽에 하기 때문에 피스 자리로 물이 들어가지 않습니다. 태양광이 올라간 옥상은 누수가 시작되는 자리가 어느 정도 정해져 있습니다. 패널을 세우려면 기둥을 콘크리트에 앙카로 고정해야 하는데, 그 과정에서 바닥....... <img src="https://blogthumb.pstatic.net/MjAyNjA5MDFfODcg/MDAxNzg4MjQ4Njg1MTY4.VwSJTMQBAn3pZBXpGCWQCrteYUfrK2S_PVqAzUR6CJ8g.JDuT6qDzbe0mpdVM-ZrfHlW8uDk-caxfVzoj53MtNvwg.PNG/1.png?type=s3" /> ]]>
