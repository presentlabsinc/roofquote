                - generic [ref=f52e1730]: <description>
              - generic [ref=f52e1731]: <![CDATA[ 옥상 스틸방수는 방수 도료를 바르는 공사가 아닙니다. 옥상 위에 경사진 칼라강판 지붕을 하나 더 얹는 공사예요. 비가 방수층에 닿기 전에 흘려보내는 것, 그게 이 공법의 전부입니다. 도막이 아니라 구조로 물을 막으니까 몇 년마다 다시 바르는 재시공이라는 개념 자체가 없죠. 오늘은 서울 구로동 현장을 보면서 이 공법의 원리를 정리해 보려고 합니다. 우레탄 방수, 왜 자꾸 다시 해야 할까? 시공 전 옥상입니다. 이 댁도 몇 해 전 방수 공사를 했는데 누수가 다시 발생하여 저희를 찾으셨어요. 우레탄이 나쁜 공법이라서가 아닙니다. 도막 방수에는 어쩔 수 없는 한계가 있을 뿐이죠. 첫째, 자외선. 옥상 바닥은 여름 한낮에 표면 온도가....... <img src="https://blogthumb.pstatic.net/MjAyNjA3MjdfMjY2/MDAxNzg1MTM5Nzg1MDI0.09w6RC-yRgWyzJugBCx_Yh4t9ab1K5qMQe09Pt9Eys4g.o-vHoVMi4K-gwZYbM2f9kOjJjvpgrKjBkPwvLjA3gAUg.JPEG/%BA%CE%C1%A6%B8%F1_%C3%DF%B0%A1_%282%29.jpg?type=s3" /> ]]>
