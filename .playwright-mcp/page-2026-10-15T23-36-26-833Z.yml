              - generic [ref=f52e2351]: <![CDATA[ 안녕하세요. 칼라강판 전문 기업 한농스틸입니다. 옥상이나 지붕, 그리고 외벽누수 때문에 스트레스받는 분들이 많으신데요. 임시방편으로 실리콘을 바르거나 페인트를 덧칠하는 것만으로는 근본적인 문제가 되지 않습니다. 오늘은 실제 시공 사례를 통해 빗물을 완벽히 차단하여 벽보수 공사가 필요 없는 기술을 보여드릴게요. 노후화된 적벽돌 건물, 템바징크로 새 옷을 입다 먼저 보실 곳은 영등포에 있는 상가 건물이며 세월의 흔적만큼이나 외벽누수 위험이 높은 상태였거든요. 2층만 템바징크를 시공한 모습이에요. 템바징크는 굴곡진 입체적인 디자인이 특징인 자재로 세련된 느낌을 주면서도 외부의 빗물을 완벽하게 차단해 주는 역할을....... <img src="https://blogthumb.pstatic.net/MjAyNjA0MDhfMTY0/MDAxNzc1NjMzMDk4MTMw.ZO6iDem_ta0hHN7UwO0t16MmYJupmXPeItaqh7dozSMg.RIYulmcJiRLpmnbO7oN_kJdyNDiUdqmMqaiGojop_bIg.JPEG/newpost_%BF%DC%BA%AE%B4%A9%BC%F6_%280%29.png_374292_1775632337568_1775632387561_0_main.jpg?type=s3" /> ]]>
