                - generic [ref=f52e1110]: <description>
              - generic [ref=f52e1111]: <![CDATA[ 아스팔트슁글 지붕부터 옥상 바닥까지 강판으로 새로 씌운 지붕방수 현장입니다. 기존 슁글과 우레탄은 철거하지 않고 그 위를 덮어서 폐기물도 나오지 않게 만들어요. 공사 전후를 보여드릴게요. 건물도 시간이 갈수록 노후화가 되다 보니 유지 보수나 리모델링이 필요할수 있어요. 하지만 누수는 노후화와 다른 문제입니다. 가장 좋은 방법은 오래가고 누수가 없으며 유지 보수도 없는게 가장 좋은 자재인데요 이곳에 시공된 칼라강판이 그 자재입니다. 바닥은 흰색 우레탄, 난간 벽은 녹색 우레탄 공사가 되어 있는데 생각보다 오래 못 가죠. 누수가 있어도 원인도 찾기가 쉽지 않고요. 그런데 한농스틸이 개발한 바닥 시트형은 누수를 완벽하....... <img src="https://blogthumb.pstatic.net/MjAyNjA4MjJfMjc4/MDAxNzg3Mzk1Nzc0NjQ5.AH7tzJhr7wQ3tmFys4nj4oiWIFujbmtIgzgmrMYJe08g.Y6-YUuVe_VsFalNrR83oA7L7UXBzVU3_DhqCKOCQRb0g.PNG/ht.png?type=s3" /> ]]>
