              - generic [ref=f52e2537]: <![CDATA[ 안녕하세요, 칼라강판을 활용한 옥상 방수와 지붕 및 외벽 공사를 전문으로 하는 한농스틸입니다. 저희는 국내 최초로 개발하여 특허 등록까지 마친 '바닥 시트형' 옥상 방수 공법을 통해 건물의 고질적인 천장누수 문제를 원천적으로 차단해 드리고 있어요. 포스코(POSCO)에서 생산하는 아연 도금 및 칼라 도색 코팅 처리된 정품 금속 소재만을 사용하여, 한 번의 시공으로 30년 이상의 수명을 기대할 수 있는 확실한 과정을 현장 사진과 함께 자세히 설명해 드리겠습니다. 기존 우레탄 바닥의 한계와 새로운 기초 작업 시공 전 흔히 볼 수 있는 녹색 우레탄 바닥 상태입니다. 시간이 지나면 직사광선과 온도 변화에 의해 바닥이 갈라....... <img src="https://blogthumb.pstatic.net/MjAyNjA0MDdfMTU4/MDAxNzc1NTQ1NzQyMjQy.lxfBmTeHD2uzZL8FVxBFCjJYRkpxIQ0DRNWtHsL5Sf0g.auMSiAQ6DUGIgCo-sVWsn5DsxdyEQUaq93WH4WKVIBsg.JPEG/newpost_%C3%B5%C0%E5%B4%A9%BC%F6_%281%29.jpg_953163_1775545214874_1775545472632_0_main.jpg?type=s3" /> ]]>
