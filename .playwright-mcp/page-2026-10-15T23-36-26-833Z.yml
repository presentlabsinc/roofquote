              - generic [ref=f52e1669]: <![CDATA[ 옥상방수 비용을 물으실 때 저희가 가장 먼저 드리는 답은 “10년으로 계산해 보시라”는 것입니다. 우레탄 방수는 회당 비용이 싼 대신 3~5년마다 다시 해야 하고, 스틸방수는 처음 한 번이 비싼 대신 재시공이 없어요. 30평 기준으로 놓고 보면 우레탄 누적 900만~1,350만 대 스틸방수 800만, 두 번째 재시공하는 순간 이미 계산이 뒤집힙니다. 오늘은 이 숫자가 어떻게 나오는지 그리고 같은 평수인데 견적이 왜 현장마다 다른지를 정리해 보겠습니다. 먼저 구성부터 보여드릴게요. 총비용에서 자재비가 40%, 인건비가 30~35%, 장비·경비가 10%, 그리고 저희 마진이 15%입니다. 마진까지 공개하는 이유는 간단해요. 어차피 견적 비교하다 보면....... <img src="https://blogthumb.pstatic.net/MjAyNjA3MTdfMjYy/MDAxNzg0MjY5MDg1MDU0.AKJK39lfNSXjqArzq8GyALTPWiGhTHywEUNN_tHb7rEg.AA8AYtEOpCMSlDCk7nD8kkodaqJjseYscxkbK8rxKLkg.PNG/0.png?type=s3" /> ]]>
