              - generic [ref=f74e2785]: <![CDATA[ 옥상 스틸방수 시공 방법과 장단점 총정리 옥상·테라스 누수 해결, 왜 스틸방수가 답일까? 안녕하세요. ㈜유반장스틸방수 공식 블로그입니다. 옥상과 테라스는 건물 중에서도 가장 빨리 노후화가 진행되는 공간입니다. 비·바람·자외선에 그대로 노출되다 보니 방수가 제대로 되어 있지 않으면 누수 → 곰팡이 → 철근 부식 → 구조체 손상으로 이어지게 됩니다. 오늘은 많은 분들이 비교하시는 우레탄 방수 vs 스틸방수의 차이와, 저희가 직접 시공하는 스틸방수 공법의 시공 과정·장점·주의할 점까지 한눈에 정리해 드리겠습니다. ✅ 왜 옥상·테라스 방수 시공이 필요한가? 콘크리트는 시간이 지나면 균열 발생 기온 변화에 따른 수축·팽창....... <img src="https://blogthumb.pstatic.net/MjAyNTA5MTVfMjk0/MDAxNzU3ODk1NDk0MTc1.flET1U0lzEOhMFABnC9olZhk58L9xYvLYAJbjQfA7Nwg.WEBwKJUWcBAO5DQ3G1t4A07rfFmFymzRy2-JNmAvlNwg.JPEG/%BD%E6%B3%D7%C0%CF_%B9%E6%BC%F6.jpg?type=s3" /> ]]>
