                - generic [ref=f74e180]: <description>
              - generic [ref=f74e181]: <![CDATA[ 대전지붕공사, 무조건 지붕을 덮으면 될까요? 합법 시공과 소방법까지 확인해야 합니다 대전에서 옥상 누수 때문에 지붕공사를 알아보시는 분들이 많습니다. 기존 우레탄방수를 다시 시공할지, 칼라강판 지붕을 새로 설치할지, 스틸방수로 해결할지 고민하게 됩니다. 하지만 대전지붕공사는 물만 새지 않게 막는다고 끝나는 공사가 아닙니다. 옥상 위에 새로운 지붕 구조물을 설치할 경우 건축물의 높이와 면적, 지붕틀 변경 여부에 따라 증축이나 대수선으로 판단될 수 있습니다. 허가나 신고 대상인데도 확인 없이 공사하면 위반건축물 문제가 생길 수 있고, 건물의 용도와 구조에 따라 소방법까지 함께 검토해야 합니다. 따라서 지붕공사를 시....... <img src="https://blogthumb.pstatic.net/MjAyNjA4MzFfMjg3/MDAxNzg4MTQ0MjE4MjA4.wEDl4fTi1AY0wFD6p0iLOhXoMm19_d-H9-6m_LxjXDUg.UFLZsjWJpvacmgfe_MhDd3mD6iwRSoJFFgSZsykSAdsg.JPEG/%BE%C6%BB%EA__%C3%BB%C8%AD%BA%F4.jpg?type=s3" /> ]]>
