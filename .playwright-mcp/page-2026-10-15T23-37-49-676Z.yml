                - generic [ref=f74e2846]: <description>
              - generic [ref=f74e2847]: <![CDATA[ 진주·사천 옥상방수 & 지붕공사, 칼라강판 스틸방수가 정답입니다 유반장스틸방수 전남광양점 시공사례 소개 안녕하세요. 국가공인 자격 기술자와 정식 건설업 면허를 보유한 (주)유반장스틸방수 전남 광양지점입니다. 오늘은 진주, 경남 사천 지역의 옥상 누수 문제로 고민 중인 분들을 위해 최근 시공한 칼라강판 기반 스틸지붕공사 및 옥상방수 시공사례를 중심으로 스틸방수 공법의 특징과 장점을 안내드리겠습니다. 왜 칼라강판 스틸방수가 필요한가요? 경남 지역은 바닷바람과 강수량이 많고, 여름에는 습도까지 높습니다. 특히 진주나 사천처럼 기온차가 큰 지역은 옥상과 지붕의 내구성이 급격히 저하되기 쉽습니다. 우레....... <img src="https://blogthumb.pstatic.net/MjAyNTA5MTJfMjU2/MDAxNzU3NjI3ODM4Njg1.NelxKbRPRJq-XpRLn4nBmL4z_n26d28H9xSJWfqPf80g.haTSYs9vsYyYeE8gphDazRrzRUkKP66UJz55e5juR8Eg.PNG/%BD%E6%B3%D7%C0%CF_final.png?type=s3" /> ]]>
