              - generic [ref=f74e367]: <![CDATA[ 빌라 천장에 물자국이 생기거나 벽지가 젖고 곰팡이가 발생한다면 옥상 누수를 의심해 볼 수 있습니다. 처음에는 비가 많이 내릴 때만 나타나지만 시간이 지나면 적은 비에도 누수가 반복될 수 있습니다. 빌라 옥상방수는 물이 떨어지는 부분에 방수재만 덧바르는 공사가 아닙니다. 빗물이 들어오는 위치와 이동 경로, 옥상의 배수 상태를 함께 확인해야 합니다. 빌라 옥상 누수가 발생하는 주요 원인 빌라 옥상은 햇빛과 비, 눈, 바람에 계속 노출되어 있습니다. 여름에는 표면 온도가 높아지고 겨울에는 얼고 녹는 과정이 반복됩니다. 이러한 온도 변화로 콘크리트와 방수층이 팽창하고 수축하면서 균열이 생길 수 있습니다. 기존 우레탄방수층....... <img src="https://blogthumb.pstatic.net/MjAyNjA4MDdfODcg/MDAxNzg2MDc0NTU1MDMy.kUdeSy1sr0nmZrsxUijw77RWCWllMZdtuO0qs9LCz6wg.UZ0oQTvbVNoxwqAsNR5Lv8H-d1vc86RKOC6JjJpJhVsg.JPEG/%BD%BA%C6%BF%B9%E6%BC%F6_%C1%A6%B8%F1_%BD%E6%B3%D7%C0%CF.jpg?type=s3" /> ]]>
