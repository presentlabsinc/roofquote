              - generic [ref=f74e119]: <![CDATA[ 안녕하세요. 옥상방수·지붕공사·외벽스틸방수 전문기업 ㈜유반장스틸방수 광양 남부지점입니다. 오늘 소개할 현장은 경남 진주시 문산읍 옥상방수 현장입니다. 이번 현장은 광양 남부지점 이철민 팀장이 상담과 실측, 공정관리를 담당하고 대전 본사의 기술관리 기준에 따라 시공했습니다. 옥상 바닥에는 리얼스틸방수를 적용하고, 외벽 난간은 세로 골이 촘촘한 루버징크로 마감했습니다. 이러한 세로 골 디자인의 징크는 카페나 상업시설에서 자주 사용돼 현장에서는 흔히 ‘스타벅스 징크’라고 부릅니다. ※ ‘스타벅스 징크’는 특정 회사의 공식 제품명이 아니라 세로형 루버 디자인을 이해하기 쉽게 표현한 현장 용어입니다. 이번 진주 문....... <img src="https://blogthumb.pstatic.net/MjAyNjA5MTZfMTYx/MDAxNzg5NTY3MDAzODMz.ePVu5Ol0I7mv-amzY0LJe5Y_Xb7ke6hZe5AuzS0KwSEg.Zr1Ol3frQNE1BL1MtTjS5qCpJzwnGhGLp8i-9cffs3Ig.JPEG/%C1%F8%C1%D6_%B9%AE%BB%EA_%BD%BA%C6%BF%B9%E6%BC%F6_%B7%E7%B9%F6%C2%A1%C5%A9.jpg?type=s3" /> ]]>
