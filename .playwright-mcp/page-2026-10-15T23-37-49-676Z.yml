              - generic [ref=f74e2723]: <![CDATA[ 지붕공사 관련 자격증 종류와 옥상방수·지붕공사·외벽스틸방수 시공사례 안녕하세요. ㈜유반장스틸방수 공식 블로그입니다. 지붕공사나 옥상방수는 단순히 시공 능력만으로는 해결되지 않습니다. 국가공인 자격증을 보유한 전문가가 참여해야만 합법성과 안정성을 확보할 수 있습니다. 오늘은 지붕공사에 필요한 관련 자격증 종류를 정리하고, 저희가 직접 진행한 옥상방수·지붕공사·외벽 스틸방수 시공사례도 함께 소개하겠습니다. 1️⃣ 건축기사 · 건축산업기사 건축 전반의 구조와 시공을 관리하는 자격으로, 지붕공사·옥상방수까지 포함됩니다. 시공 현장의 종합적 관리 능력을 인증하기 때문에, 대형 현장에서 특히 신뢰도가 높습니다....... <img src="https://blogthumb.pstatic.net/MjAyNTA5MjFfMTQ2/MDAxNzU4NDIzNTkxMzAz.0uVFQ23oDGQmho-gzuES2gPRRuNhrtHOtxoi42vz4e4g.oKGp_YPpvtLF0WExPeGH5pHXaYY1RpZi_ANFbnraO7Ig.JPEG/%BD%E6%B3%D7%C0%CF_%B9%E6%BC%F6.jpg?type=s3" /> ]]>
