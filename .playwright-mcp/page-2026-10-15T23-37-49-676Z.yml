              - generic [ref=f74e2165]: <![CDATA[ 분당 상가건물 옥상방수 시공 사례 유반장스틸방수 스틸방수로 누수·단열·건물 가치까지 개선 상가건물 옥상은 주택보다 훨씬 많은 하중과 기계설비, 실외기, 배관 등이 집중되어 있어 방수 문제 발생 시 피해 규모가 큰 공간입니다. 이번 현장은 분당에 위치한 상가건물 옥상으로, 기존 방수층 노후로 인해 우천 시 누수와 함께 실내 습도 상승, 천장 마감 손상 문제가 반복적으로 발생하고 있었습니다. 분당 상가 옥상, 왜 스틸방수가 필요했을까? 분당·판교 상권 지역 상가건물은 여름철 폭염 겨울철 한파 냉난방 실외기 상시 가동 옥상 설비 집중 배치 로 인해 일반 주택보다 옥상 환경이 훨씬 가혹합니다. 기존 우레탄 방수는 시간이 지나면....... <img src="https://blogthumb.pstatic.net/MjAyNjAxMTZfMjcw/MDAxNzY4NTI0MjY1NDcz.SCKVT19Cs-BL6SKnvn5S85Im8_7hJtb3NLmhscw2TOEg.fZ5f13OE65V6jrDht5KKlb0FpG7JD29zBiMXWKafyG8g.JPEG/%BA%D0%B4%E7_%BF%C0%BC%BA%C7%C1%B6%F3%C0%DA_%B8%AE%BE%F3.jpg?type=s3" /> ]]>
