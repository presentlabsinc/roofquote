              - generic [ref=f74e2351]: <![CDATA[ 녹슬지 않는 철판, 포스맥(PosMAC) 강판의 모든 것 드론 촬영으로 보는 실제 적용 사례 ㈜유반장스틸방수는 포스코 PosMAC(포스맥) 정품 자재를 사용한 시공 현장을 드론 영상으로 직접 촬영하여, 공사 전후 모습을 생생하게 공개하고 있습니다. 1️⃣ 포스맥(PosMAC) 이란? PosMAC은 POSCO(포스코)가 개발한 차세대 내식성 강판으로, 기존 용융아연도금강판(GI)에 **마그네슘(Mg)**과 **알루미늄(Al)**을 더한 신소재입니다. 이 세 가지 금속이 결합된 도금층이 강력한 보호막을 형성해, 기존 GI 대비 5~10배 이상의 내식 성능을 보여줍니다. 2️⃣ 포스맥의 구조 이 복합 도금층이 부식 진행을 억제하고, 절단면까지 스스로 보호하는....... <img src="https://blogthumb.pstatic.net/MjAyNTEwMTBfMTc5/MDAxNzYwMTA0NTM4NTkw.j9ZUqFonT5zOvNOkCGkwGB9MPtaGyZYxv9vt16N48Pwg.osxjdheJv8fPivMPD89Ze9o39FSbNE_33nWkYv1nI-Yg.PNG/%C1%A6%B8%F1%C0%BB_%C0%D4%B7%C2%C7%CF%BC%BC%BF%E4_%282%29.png?type=s3" /> ]]>
