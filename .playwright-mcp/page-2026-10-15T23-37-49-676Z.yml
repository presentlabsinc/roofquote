                - generic [ref=f74e242]: <description>
              - generic [ref=f74e243]: <![CDATA[ 옥상방수 견적서 비교할 때 반드시 확인해야 할 8가지 옥상방수 견적을 여러 업체에서 받아보면 금액 차이가 크게 나는 경우가 있습니다. 같은 면적을 견적했는데도 가격이 다른 이유는 자재와 공법, 포함된 공사 범위가 서로 다르기 때문입니다. 총공사비만 비교하면 계약 후 추가 비용이 발생하거나 예상했던 공사가 빠질 수 있습니다. ■ 1. 실제 시공면적 건축물대장에 표시된 면적과 실제 옥상 시공면적은 다를 수 있습니다. 옥탑, 난간, 돌출부, 경사면과 물받이 부분이 추가되기 때문입니다. 견적서에는 실측면적과 계산 기준이 표시되어 있어야 합니다. ■ 2. 자재의 정확한 사양 ‘최고급 자재’라는 표현만으로는 정확한 비교가 어렵습....... <img src="https://blogthumb.pstatic.net/MjAyNjA4MjNfNDkg/MDAxNzg3NDg4MzkwNDA0.p1VJl251dVherqRNgHI8cB1xBT_tRgM_8LYnq00Tzqcg.AfzBur-RyxVx38ia33qgbg2_Vw9kqal3u_TKNcOcszwg.JPEG/%BD%BA%C6%BF%B9%E6%BC%F6_%C1%A6%B8%F1_%BD%E6%B3%D7%C0%CF.jpg?type=s3" /> ]]>
